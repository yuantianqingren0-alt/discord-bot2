services:
  - type: web
    name: discord-antitroll-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: QUARANTINE_ROLE_ID
        sync: false
      - key: SETTINGS_DATA_DIR
        value: /tmp
