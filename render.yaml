# Render の Blueprint(IaC)設定ファイル
# 「New +」→「Blueprint」からこのリポジトリを選択すると、この内容で自動セットアップされます。
#
# デフォルトは Background Worker(有料プラン、$7/月〜)を使う構成にしています。
# 常時起動が保証され、Discord Botには最も適した方式です。
#
# 無料で試したい場合は、下記コメントを参考に type を web に変更し、
# main.py 側で keep_alive.py を有効化してください(README参照)。

services:
  - type: worker
    name: discord-antitroll-bot
    env: python
# Background Workerは無料プラン非対応。starter以上が必要
plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: QUARANTINE_ROLE_ID
        sync: false
      - key: SETTINGS_DATA_DIR
        value: /data
    disk:
      name: antitroll-data
      mountPath: /data
      sizeGB: 1
